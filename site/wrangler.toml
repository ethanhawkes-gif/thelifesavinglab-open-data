# thelifesavinglab.org as a Cloudflare Worker that serves static assets: the built site in site/dist, nothing else.
# Deploy from the repository root:   node site/build.mjs && npx wrangler deploy --config site/wrangler.toml
# The name is the Worker that holds the custom domains thelifesavinglab.org and www.thelifesavinglab.org (it carried the
# previous site), so a deploy replaces the live site in place and the domains stay attached. Cloudflare keeps the
# previous deployments: Workers & Pages → thelifesavinglab-proxy → Deployments → Rollback brings the old site back.
name = "thelifesavinglab-proxy"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./dist"
# Old addresses (/chart, /bring, /sources) are real pages that forward; everything else that is missing gets the site's 404 page.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "thelifesavinglab.org"
custom_domain = true

[[routes]]
pattern = "www.thelifesavinglab.org"
custom_domain = true
