name: deploy-site
# Publishes site/dist to thelifesavinglab.org as a static-assets Worker on every push that changes the site or its data.
# It deploys only once two repository settings exist (Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   variable CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers & Pages overview
# Optional variable SITE_WORKER_NAME: the name of the Worker that holds the custom domain (default: thelifesavinglab).
on:
  push:
    branches: [main]
    paths: ['site/**', 'estimates/**', 'tasks/**', 'receipts/**', 'watch/feed.json', '.github/workflows/deploy-site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-site
  cancel-in-progress: true
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  SITE_WORKER_NAME: ${{ vars.SITE_WORKER_NAME || 'thelifesavinglab' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node site/build.mjs
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 deploy --config site/wrangler.toml --name "$SITE_WORKER_NAME"
      - name: Not deployed
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::site/dist built; add the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable to deploy it to thelifesavinglab.org"
