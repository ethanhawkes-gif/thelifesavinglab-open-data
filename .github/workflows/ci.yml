name: ci
on:
  push:
    paths-ignore:
      - 'watch/queue.json'
      - 'watch/feed.json'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: build data and check it is committed
        run: npm run build:data && git diff --exit-code -- src/data seeds dist
      - name: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            grep -E '^not ok' test.log | sed 's/^/::error::/'
            grep -E 'error:|expected|actual|Error \[|code:' test.log | head -12 | sed 's/^/::warning::/'
            exit 1
          }
      - name: returned bundles
        run: npm run check:bundles
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - run: npm audit --audit-level=moderate
