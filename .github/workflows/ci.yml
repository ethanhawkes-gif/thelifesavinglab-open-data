name: ci
on:
  push:
    paths-ignore:
      - 'watch/queue.json'
      - 'watch/feed.json'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
